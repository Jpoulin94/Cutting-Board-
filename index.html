<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cutting Board Designer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M9 5v14M15 5v14M3 12h18" /></svg>
        <span>Cutting Board Designer</span>
      </div>
      <input id="designName" class="design-name" type="text" spellcheck="false" aria-label="Design name" />
      <span id="saveState" class="save-state"></span>
      <div class="spacer"></div>
      <div class="icon-group">
        <button id="btnUndo" class="icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo">
          <svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-3" /></svg>
        </button>
        <button id="btnRedo" class="icon-btn" title="Redo (Ctrl+Y)" aria-label="Redo">
          <svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H10a6 6 0 0 0 0 12h3" /></svg>
        </button>
      </div>
      <div class="seg units" role="radiogroup" aria-label="Units">
        <button data-units="in" role="radio">in</button>
        <button data-units="mm" role="radio">mm</button>
      </div>
      <div class="menu-wrap">
        <button id="btnFile" class="ghost" aria-haspopup="menu">File <span class="caret"></span></button>
        <div class="menu" id="fileMenu" role="menu" hidden>
          <button data-file="new" role="menuitem">New board</button>
          <button data-file="stock" role="menuitem">New from a stock design…</button>
          <button data-file="open" role="menuitem">Open saved board…</button>
          <button data-file="duplicate" role="menuitem">Save a copy</button>
          <hr />
          <button data-file="exportDesign" role="menuitem">Download this board</button>
          <button data-file="exportAll" role="menuitem">Download backup of everything</button>
          <button data-file="import" role="menuitem">Load a file…</button>
        </div>
      </div>
      <button id="btnSpecies" class="ghost">Species</button>
      <button id="btnSave" class="ghost" title="Save in this browser (Ctrl+S)">Save</button>
      <button id="btnPlan" class="ghost">Build steps</button>
      <button id="btnSheet" class="primary">Shop sheet</button>
      <input id="fileInput" type="file" accept=".json,application/json" hidden />
    </header>

    <main class="layout">
      <aside class="sidebar" id="leftPanel" aria-label="Design"></aside>

      <section class="stage">
        <canvas id="preview" aria-label="3D preview of the board"></canvas>
        <div class="views seg" role="radiogroup" aria-label="View">
          <button data-view="angle">3D</button>
          <button data-view="top">Top</button>
          <button data-view="side">Side</button>
          <button data-view="end">End</button>
        </div>
        <div class="dims" id="dims"></div>
        <div class="hint" id="hint">Drag to turn · scroll to zoom · click a block to change its strip</div>
        <div class="picker" id="picker" hidden></div>
      </section>

      <aside class="inspector" id="rightPanel" aria-label="Cut list"></aside>
    </main>

    <div id="planView" class="plan-view" hidden role="dialog" aria-label="Build steps">
      <div class="plan-bar">
        <strong id="planTitle"></strong>
        <span id="planCount" class="muted"></span>
        <div class="spacer"></div>
        <button id="btnPlanReset" class="ghost small">Clear ticks</button>
        <button id="btnClosePlan" class="ghost">Close</button>
      </div>
      <div id="planTrack" class="plan-track"></div>
      <div class="plan-nav">
        <button id="btnPlanPrev">Back</button>
        <div id="planDots" class="plan-dots"></div>
        <button id="btnPlanNext" class="primary">Next</button>
      </div>
    </div>

    <div id="sheetView" class="sheet-view" hidden>
      <div class="sheet-bar">
        <strong>Shop sheet</strong>
        <span class="muted">Print it, or choose “Save as PDF” in the print dialog.</span>
        <div class="spacer"></div>
        <button id="btnPrint" class="primary">Print / Save PDF</button>
        <button id="btnCloseSheet" class="ghost">Close</button>
      </div>
      <div id="sheetBody"></div>
    </div>

    <dialog id="dialog">
      <form method="dialog">
        <h3 id="dialogTitle"></h3>
        <div id="dialogBody"></div>
        <menu id="dialogButtons"></menu>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="js/units.js"></script>
    <script src="js/species.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/presets.js"></script>
    <script src="js/preview3d.js"></script>
    <script src="js/sheet.js"></script>
    <script src="js/illustrate.js"></script>
    <script src="js/planner.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
